<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undangan Pernikahan Raka & Alya</title>
<meta property="og:title" content="Pernikahan Raka & Alya">
<meta property="og:description" content="Sabtu, 6 Maret 2027">
<link rel="icon" type="image/webp" href="https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-byzkk@main/logo_20260906_093655_0000.jpg">
<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-byzkk@main/logo_20260906_093655_0000.jpg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sky:#e6eeff;--cobalt:#2547f5;--pink:#ff5c8a;--sun:#ffd23f;--ink:#101938;--white:#fff;--f:"Bricolage Grotesque",system-ui,sans-serif;--m:"DM Mono",ui-monospace,monospace;--sh:4px 4px 0 var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:400 17px/1.6 var(--f);background:var(--sky);color:var(--ink)}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
h1,h2,h3{font-weight:800;line-height:.98;letter-spacing:-.03em}
h2{font-size:clamp(2.4rem,7vw,4.4rem);color:var(--cobalt);margin-bottom:2rem}
section{padding:clamp(3.5rem,9vw,6.5rem) 6%}
.wrap{max-width:1040px;margin:auto}
.btn{display:inline-block;font:700 .95rem var(--f);color:var(--ink);background:var(--white);border:2px solid var(--ink);border-radius:14px;padding:.7rem 1.3rem;box-shadow:var(--sh);cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.pk{background:var(--pink)}.btn.sn{background:var(--sun)}
.row{display:flex;flex-wrap:wrap;gap:.8rem}
#bar{position:fixed;top:0;left:0;height:5px;width:100%;background:var(--pink);transform-origin:0 50%;transform:scaleX(0);z-index:80}

/* Cover: boarding pass */
#cover{position:fixed;inset:0;z-index:60;background:var(--cobalt);display:grid;place-items:center;padding:1.2rem;transition:transform 1s cubic-bezier(.7,0,.2,1)}
#cover.out{transform:translateY(-100%)}
.pass{display:grid;grid-template-columns:1fr auto;width:min(860px,100%);background:var(--white);border:2px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--ink);rotate:-1.5deg;overflow:hidden}
.pass .main{padding:clamp(1.2rem,4vw,2.4rem)}
.pass h1{font-size:clamp(2.8rem,10vw,6rem);color:var(--cobalt);margin:.8rem 0 1.2rem}
.pass h1 span{color:var(--pink)}
.pass dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1rem;font-family:var(--m)}
.pass dt{font-size:.72rem;color:#5b6490}
.pass dd{font-size:1rem;font-weight:500}
.route{display:flex;justify-content:space-between;align-items:center;font:700 1.1rem var(--f);gap:1rem}
.route i{flex:1;border-top:3px dotted var(--ink);position:relative}
.route i::after{content:"✈";position:absolute;right:42%;top:-.95rem;background:var(--white);padding:0 .3rem}
.stub{border-left:3px dashed var(--ink);padding:1.4rem;display:grid;align-content:center;gap:1rem;background:var(--sun);transform-origin:0 100%;transition:transform .8s cubic-bezier(.5,0,.8,.4),opacity .8s}
.stub p{font-family:var(--m);font-size:.8rem}
.pass.tear .stub{transform:rotate(28deg) translate(60px,260px);opacity:0}
@media(max-width:640px){.pass{grid-template-columns:1fr}.stub{border-left:0;border-top:3px dashed var(--ink)}.pass.tear .stub{transform:rotate(-12deg) translateY(200px)}}

/* Hero */
.hero{min-height:100vh;display:grid;align-items:center;padding-top:5rem}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center}
.hero h1{font-size:clamp(3.6rem,13vw,9rem);color:var(--cobalt)}
.hero h1 b{display:inline-block;background:var(--pink);color:var(--white);font-size:.45em;padding:.1em .35em;border-radius:50%;rotate:12deg;margin:0 .1em;vertical-align:middle;border:2px solid var(--ink)}
.hero .date{font:500 1.1rem var(--m);margin:1.4rem 0 2rem}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;max-width:480px}
.cd div{background:var(--white);border:2px solid var(--ink);border-radius:14px;box-shadow:var(--sh);padding:.7rem .4rem;text-align:center}
.cd b{display:block;font:800 clamp(1.8rem,6vw,2.6rem)/1 var(--f)}
.cd small{font:.75rem var(--m)}
.pol{background:var(--white);padding:12px 12px 56px;border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);rotate:3deg;position:relative}
.pol::after{content:attr(data-cap);position:absolute;bottom:14px;left:0;right:0;text-align:center;font:500 .95rem var(--m)}
.xf{position:relative;overflow:hidden;background:var(--ink);aspect-ratio:4/5}
.xf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s}
.xf img.on{opacity:1}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.pol{max-width:380px;margin:1rem auto 0}}

/* Ayat */
.ayat{background:var(--sun);border-block:2px solid var(--ink)}
.ayat blockquote{font:700 clamp(1.3rem,3.4vw,2rem)/1.3 var(--f);max-width:28em;letter-spacing:-.01em}
.ayat cite{display:block;margin-top:1rem;font:500 1rem var(--m)}

/* Mempelai (paspor) */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem}
.paspor{background:var(--white);border:2px solid var(--ink);border-radius:18px;box-shadow:var(--sh);padding:1.2rem}
.paspor:nth-child(2){rotate:1.2deg}.paspor:nth-child(1){rotate:-1.2deg}
.paspor img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:2px solid var(--ink);margin-bottom:1rem}
.paspor h3{font-size:2rem;margin-bottom:.8rem}
.paspor dl{font-family:var(--m);font-size:.9rem;margin-bottom:1rem}
.paspor dt{font-size:.72rem;color:#5b6490}.paspor dd{margin-bottom:.5rem}

/* Rute cerita */
.rt{position:relative;margin-left:14px;padding-left:2.2rem;max-width:640px;border-left:4px dotted #9aa8e6}
.rt::before{content:"";position:absolute;left:-4px;top:0;width:4px;height:calc(var(--p,0)*100%);background:var(--pink)}
.stop{position:relative;padding-bottom:2.6rem}
.stop::before{content:"";position:absolute;left:calc(-2.2rem - 12px);top:.35rem;width:20px;height:20px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.stop h3{font-size:1.7rem;margin-bottom:.3rem}
.stop small{font:.85rem var(--m);color:var(--cobalt)}

/* Tiket acara */
.tk{position:relative;display:grid;grid-template-columns:auto 1fr;gap:1.5rem;background:var(--white);border:2px solid var(--ink);border-radius:18px;box-shadow:var(--sh);padding:1.6rem;margin-bottom:2rem}
.tk::before,.tk::after{content:"";position:absolute;left:calc(7.2rem);width:26px;height:26px;border-radius:50%;background:var(--sky);border:2px solid var(--ink)}
.tk::before{top:-14px}.tk::after{bottom:-14px}
.tk .tg{border-right:3px dashed var(--ink);padding-right:1.5rem;text-align:center;min-width:5.5rem}
.tk .tg b{display:block;font:800 4.5rem/1 var(--f);color:var(--pink)}
.tk .tg span{font:.85rem var(--m)}
.tk h3{font-size:2.2rem;margin-bottom:.6rem}
.tk p{margin:.2rem 0}.tk .row{margin-top:1.2rem}
@media(max-width:600px){.tk{grid-template-columns:1fr}.tk .tg{border-right:0;border-bottom:3px dashed var(--ink);padding:0 0 1rem;text-align:left}.tk::before,.tk::after{left:auto;top:auto;bottom:auto;display:none}}

/* Dress code */
.dress{background:var(--white);border-block:2px solid var(--ink)}
.sw{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.2rem}
.sw button{width:64px;height:64px;border-radius:50%;border:2px solid var(--ink);box-shadow:var(--sh);cursor:pointer}

/* Galeri */
.ms{columns:2 230px;column-gap:16px}
.ms button{display:block;width:100%;margin-bottom:16px;padding:8px;background:var(--white);border:2px solid var(--ink);box-shadow:var(--sh);cursor:zoom-in}
.ms button:nth-child(odd){rotate:-1.2deg}.ms button:nth-child(even){rotate:1.2deg}
.ms img{width:100%}
#lb{position:fixed;inset:0;z-index:90;background:rgba(16,25,56,.95);display:none;place-items:center}
#lb.on{display:grid}
#lb img{max-height:86vh;max-width:92vw;border:6px solid var(--white)}
#lb button{position:absolute;background:none;border:0;color:var(--white);font-size:2.4rem;padding:1rem;cursor:pointer}
#lb .x{top:0;right:0}#lb .p{left:0}#lb .n{right:0}

/* Hadiah */
.gf{background:var(--cobalt);color:var(--white)}
.gf h2{color:var(--white)}
.gf p.lead{max-width:44ch;margin-bottom:1.5rem}
#cards{display:none;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.4rem;margin-top:2rem}
#cards.on{display:grid}
.card{background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:1.4rem}
.card h3{font-size:1.6rem}.card .no{font:500 1.35rem var(--m);margin:.6rem 0 0}.card p{margin-bottom:1rem}

/* RSVP */
form{display:grid;gap:1rem;max-width:580px}
label span{display:block;font-weight:700;margin-bottom:.3rem}
input,select,textarea{width:100%;font:inherit;padding:.8rem 1rem;border:2px solid var(--ink);border-radius:12px;background:var(--white)}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
#list{margin-top:3rem;max-width:580px;max-height:440px;overflow:auto;display:grid;gap:1rem;padding:6px}
#list article{background:var(--white);border:2px solid var(--ink);border-radius:14px;padding:1rem 1.2rem}
#list h4{font-size:1.1rem}#list small{font:.8rem var(--m);color:#5b6490}
.empty{font-family:var(--m);font-size:.9rem}

/* Penutup */
.end{background:var(--pink);border-top:2px solid var(--ink);min-height:80vh;display:grid;align-content:center}
.end h2{color:var(--white);font-size:clamp(3.4rem,13vw,9rem)}
.end p{max-width:46ch;margin-bottom:1.6rem;font-size:1.1rem}
footer{padding:1.6rem 6%;background:var(--ink);color:#aab4e6;font:.85rem var(--m)}

#mus{position:fixed;right:1rem;bottom:1rem;z-index:50;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:var(--sun);box-shadow:var(--sh);font-size:1.3rem;cursor:pointer;display:none}
#mus.spin{animation:sp 6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:5.5rem;translate:-50% 20px;background:var(--ink);color:var(--white);padding:.7rem 1.3rem;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:99;font:.9rem var(--m)}
#toast.on{opacity:1;translate:-50% 0}
.rv{opacity:0;transform:translateY(20px) scale(.97);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body class="lock">
<div id="bar"></div>
<div id="cover"></div>
<main id="app"></main>
<footer id="foot"></footer>
<button id="mus" aria-label="Putar atau hentikan musik">♪</button>
<div id="lb" role="dialog" aria-label="Foto"><button class="x" aria-label="Tutup">×</button><button class="p" aria-label="Sebelumnya">‹</button><img alt=""><button class="n" aria-label="Berikutnya">›</button></div>
<div id="toast" role="status"></div>
<audio id="aud" loop></audio>

<script>
/* =====================================================================
   DATA UNDANGAN — ubah bagian ini saja untuk setiap klien
   ===================================================================== */
const P = (s, w, h) => `https://picsum.photos/seed/${s}/${w}/${h}`; // placeholder: GANTI dengan URL foto asli
const C = {
  id: "raka-alya",                         // kunci unik penyimpanan ucapan
  musik: "https://cdn.jsdelivr.net/gh/zakkimusyarrof/musik-undangandigital@main/cHFL.mp3",                               // GANTI: URL file .mp3 (kosong = tombol musik disembunyikan)
  wa: "6281200000000",                     // GANTI: nomor WhatsApp penerima RSVP (format 62...)
  studio: "Nama Studio Anda",
  tujuan: "Pelaminan",                     // tulisan "tujuan" pada boarding pass
  hero: ["https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp3.webp", "https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp4.webp", "https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp5.webp"],
  ayat: { teks: "Dan di antara tanda-tanda (kebesaran)-Nya ialah Dia menciptakan pasangan-pasangan untukmu dari jenismu sendiri, agar kamu cenderung dan merasa tenteram kepadanya, dan Dia menjadikan di antaramu rasa kasih dan sayang.", sumber: "QS Ar-Rum: 21" },
  pria:   { nama: "Raka Mahendra", anak: "Putra kedua dari", ortu: "Bapak Bagas & Ibu Wulan", ig: "https://instagram.com/", foto: "https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp1.webp" },
  wanita: { nama: "Alya Prameswari", anak: "Putri pertama dari", ortu: "Bapak Arif & Ibu Nia", ig: "https://instagram.com/", foto: "https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp2.webp" },
  cerita: [
    ["Juli 2019", "Satu kereta, dua kursi bersebelahan, dan obrolan yang tidak selesai sampai stasiun akhir."],
    ["Desember 2025", "Raka mengajak Alya makan malam dan mengajukan satu pertanyaan penting."],
    ["Maret 2027", "Kami berangkat bersama menuju hidup baru, dan ingin Anda ada di sana."]
  ],
  acara: [
    { judul: "Akad Nikah", mulai: "2027-03-06T09:00:00", selesai: "2027-03-06T11:00:00", hari: "06", bulan: "Sabtu, Maret 2027", jam: "09.00 WIB", tempat: "Masjid Raya Al-Falah, Jl. Cempaka No. 8, Bandung", peta: "https://maps.google.com/" },
    { judul: "Resepsi", mulai: "2027-03-06T12:00:00", selesai: "2027-03-06T15:00:00", hari: "06", bulan: "Sabtu, Maret 2027", jam: "12.00 WIB", tempat: "Gedung Sasana Budaya, Jl. Dahlia No. 21, Bandung", peta: "https://maps.google.com/" }
  ],
  dress: { teks: "Kami akan senang bila Anda mengenakan salah satu warna ini. Ketuk warna untuk menyalin kodenya.", warna: ["#2547F5", "#FF5C8A", "#FFD23F", "#101938"] },
  galeri: ["https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp3.webp", "https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp4.webp", "https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp5.webp", "https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp6.webp", "https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp7webp", "https://cdn.jsdelivr.net/gh/zakkimusyarrof/img-src@main/pp8webp"],
  hadiah: [ { bank: "DANA", no: "0812-0000-0001", nama: "Raka Mahendra" }, { bank: "DANA", no: "0812-0000-0002", nama: "Alya Prameswari" } ],
  penutup: "Merupakan kebahagiaan dan kehormatan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu."
};

/* =====================================================================
   KODE TEMA (tidak perlu diubah)
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const A = C.pria.nama.split(" ")[0], B = C.wanita.nama.split(" ")[0];
const tamu = new URLSearchParams(location.search).get("to") || "Tamu Undangan";
const E0 = C.acara[0];
const tglTeks = new Date(E0.mulai).toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
let tt; const toast = m => { const e = $("#toast"); e.textContent = m; e.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("on"), 2200); };
const salin = (txt, pesan) => (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => {
  const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
}).then(() => toast(pesan));

/* Cover: boarding pass */
$("#cover").innerHTML = `<div class="pass" id="pass"><div class="main">
  <div class="route"><span>Lajang</span><i></i><span>${esc(C.tujuan)}</span></div>
  <h1>${A}<span>&amp;</span>${B}</h1>
  <dl><div><dt>PENUMPANG</dt><dd>${esc(tamu)}</dd></div><div><dt>TANGGAL</dt><dd>${new Date(E0.mulai).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" })}</dd></div><div><dt>GERBANG</dt><dd>${E0.judul}</dd></div><div><dt>BOARDING</dt><dd>${E0.jam}</dd></div></dl></div>
  <div class="stub"><p>Sobek bagian ini<br>untuk membuka<br>undangan.</p><button class="btn pk" id="open">Buka undangan</button></div></div>`;

const xf = (imgs) => `<div class="xf">${imgs.map((s, i) => `<img src="${s}" alt="" ${i ? 'loading="lazy"' : ""}>`).join("")}</div>`;
const paspor = (p, k) => `<div class="paspor rv"><img src="${p.foto}" alt="${p.nama}" loading="lazy"><h3>${p.nama}</h3><dl><dt>${k}</dt><dd>${p.anak} ${p.ortu}</dd></dl><a class="btn sn" href="${p.ig}" target="_blank" rel="noopener">Lihat Instagram</a></div>`;

$("#app").innerHTML = `
<section class="hero"><div class="wrap"><div>
  <h1>${A}<b>&amp;</b>${B}</h1><p class="date">${tglTeks}</p>
  <div class="cd" id="cd"><div><b id="d">0</b><small>hari</small></div><div><b id="h">0</b><small>jam</small></div><div><b id="m">0</b><small>menit</small></div><div><b id="s">0</b><small>detik</small></div></div></div>
  <div class="pol" data-cap="${A} &amp; ${B}">${xf(C.hero)}</div></div></section>
<section class="ayat"><div class="wrap rv"><blockquote>${C.ayat.teks}</blockquote><cite>${C.ayat.sumber}</cite></div></section>
<section><div class="wrap"><h2 class="rv">Dua paspor, satu tujuan</h2><div class="duo">${paspor(C.pria, "ANAK DARI")}${paspor(C.wanita, "ANAK DARI")}</div></div></section>
<section style="padding-top:0"><div class="wrap"><h2 class="rv">Rute perjalanan kami</h2><div class="rt" id="rt">${C.cerita.map(c => `<div class="stop rv"><small>${c[0]}</small><h3>${c[1].split(".")[0].split(",")[0]}</h3><p>${c[1]}</p></div>`).join("")}</div></div></section>
<section style="padding-top:0"><div class="wrap"><h2 class="rv">Tiket acara</h2>${C.acara.map((e, i) => `
  <div class="tk rv"><div class="tg"><b>${e.hari}</b><span>${e.bulan}</span></div><div><h3>${e.judul}</h3><p><b>${e.jam}</b></p><p>${e.tempat}</p>
  <div class="row"><a class="btn pk" href="${e.peta}" target="_blank" rel="noopener">Buka peta</a><button class="btn sn" data-ics="${i}">Simpan ke kalender</button></div></div></div>`).join("")}</div></section>
<section class="dress"><div class="wrap rv"><h2>Kode berpakaian</h2><p style="max-width:46ch">${C.dress.teks}</p><div class="sw">${C.dress.warna.map(w => `<button style="background:${w}" data-c="${w}" aria-label="Salin warna ${w}"></button>`).join("")}</div></div></section>
<section><div class="wrap"><h2 class="rv">Album perjalanan</h2><div class="ms">${C.galeri.map((s, i) => `<button class="rv" data-i="${i}" aria-label="Perbesar foto ${i + 1}"><img src="${s}" alt="Foto ${i + 1}" loading="lazy"></button>`).join("")}</div></div></section>
<section class="gf"><div class="wrap"><h2 class="rv">Tanda kasih</h2><p class="lead rv">Kehadiran dan doa Anda sudah cukup bagi kami. Bila ingin berbagi tanda kasih, silakan lewat e-wallet berikut.</p>
  <button class="btn sn rv" id="gbtn" aria-expanded="false">Lihat nomor e-wallet</button>
  <div id="cards">${C.hadiah.map(g => `<div class="card"><h3>${g.bank}</h3><p class="no">${g.no}</p><p>a.n. ${g.nama}</p><button class="btn pk" data-no="${g.no}" data-b="${g.bank}">Salin nomor</button></div>`).join("")}</div></div></section>
<section><div class="wrap"><h2 class="rv">Konfirmasi kehadiran</h2>
  <form id="f"><label><span>Nama</span><input name="nama" required maxlength="60" autocomplete="name" value="${tamu === "Tamu Undangan" ? "" : esc(tamu)}"></label>
  <div class="two"><label><span>Kehadiran</span><select name="hadir"><option>Hadir</option><option>Belum pasti</option><option>Tidak bisa hadir</option></select></label>
  <label><span>Jumlah tamu</span><select name="jumlah"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div>
  <label><span>Ucapan dan doa</span><textarea name="pesan" required maxlength="400"></textarea></label>
  <div class="row"><button class="btn pk" type="submit">Kirim ucapan</button><button class="btn sn" type="button" id="wa">Kirim lewat WhatsApp</button></div></form><div id="list"></div></div></section>
<section class="end"><div class="wrap rv"><h2>Sampai jumpa</h2><p>${C.penutup}</p><div class="row"><button class="btn" id="share">Bagikan undangan</button></div></div></section>`;
$("#foot").textContent = `Undangan digital oleh ${C.studio}`;

/* Buka undangan: sobek stub, lalu cover naik */
const aud = $("#aud"), mus = $("#mus");
if (C.musik) { aud.src = C.musik; mus.style.display = "block"; }
$("#open").onclick = () => {
  $("#pass").classList.add("tear");
  if (C.musik) aud.play().then(() => mus.classList.add("spin")).catch(() => {});
  setTimeout(() => { $("#cover").classList.add("out"); document.body.classList.remove("lock"); }, 900);
  setTimeout(() => $("#cover").style.display = "none", 2000);
};
mus.onclick = () => aud.paused ? (aud.play(), mus.classList.add("spin")) : (aud.pause(), mus.classList.remove("spin"));

/* Slider foto hero */
{ const im = [...$(".xf").children]; let i = 0; im[0].classList.add("on");
  setInterval(() => { im[i].classList.remove("on"); i = (i + 1) % im.length; im[i].classList.add("on"); }, 4500); }

/* Hitung mundur */
const t0 = new Date(E0.mulai).getTime();
const tick = () => {
  const d = t0 - Date.now();
  if (d <= 0) { $("#cd").innerHTML = "<div style='grid-column:1/-1'><b style='font-size:1.4rem'>Hari bahagia telah tiba</b></div>"; return clearInterval(iv); }
  $("#d").textContent = Math.floor(d / 864e5); $("#h").textContent = Math.floor(d % 864e5 / 36e5);
  $("#m").textContent = Math.floor(d % 36e5 / 6e4); $("#s").textContent = Math.floor(d % 6e4 / 1e3);
};
const iv = setInterval(tick, 1000); tick();

/* BARU: simpan acara ke kalender (.ics) */
document.querySelectorAll("[data-ics]").forEach(b => b.onclick = () => {
  const e = C.acara[b.dataset.ics], f = s => s.replace(/[-:]/g, ""), x = s => s.replace(/,/g, "\\,");
  const t = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Undangan Digital//ID", "BEGIN:VEVENT",
    `UID:${C.id}-${b.dataset.ics}@undangan`, `DTSTAMP:${f(new Date().toISOString().slice(0, 19))}Z`,
    `DTSTART:${f(e.mulai)}`, `DTEND:${f(e.selesai)}`, `SUMMARY:${x(e.judul + " " + A + " & " + B)}`, `LOCATION:${x(e.tempat)}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/calendar" }));
  a.download = `${C.id}-${e.judul.toLowerCase().replace(/\s/g, "-")}.ics`; a.click(); toast("Acara disimpan ke kalender");
});

/* BARU: salin kode warna dress code */
document.querySelector(".sw").onclick = e => { const b = e.target.closest("button"); if (b) salin(b.dataset.c, `Warna ${b.dataset.c} disalin`); };

/* BARU: bagikan undangan */
$("#share").onclick = () => {
  const d = { title: `Pernikahan ${A} & ${B}`, text: `Anda diundang ke pernikahan ${A} & ${B}, ${tglTeks}.`, url: location.href.split("?")[0] };
  navigator.share ? navigator.share(d).catch(() => {}) : salin(d.url, "Tautan undangan disalin");
};

/* Hadiah */
$("#gbtn").onclick = e => { const o = $("#cards").classList.toggle("on"); e.target.setAttribute("aria-expanded", o); };
$("#cards").onclick = e => { const b = e.target.closest("button"); if (b) salin(b.dataset.no.replace(/-/g, ""), `Nomor ${b.dataset.b} disalin`); };

/* Lightbox + geser jari */
const lb = $("#lb"), lbi = $("img", lb); let cur = 0, sx = 0;
const show = i => { cur = (i + C.galeri.length) % C.galeri.length; lbi.src = C.galeri[cur]; lb.classList.add("on"); };
$(".ms").onclick = e => { const b = e.target.closest("button"); if (b) show(+b.dataset.i); };
$(".p", lb).onclick = () => show(cur - 1); $(".n", lb).onclick = () => show(cur + 1);
$(".x", lb).onclick = () => lb.classList.remove("on");
lb.onclick = e => { if (e.target === lb) lb.classList.remove("on"); };
lb.ontouchstart = e => sx = e.touches[0].clientX;
lb.ontouchend = e => { const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 50) show(cur + (d < 0 ? 1 : -1)); };
document.addEventListener("keydown", e => { if (!lb.classList.contains("on")) return; if (e.key === "Escape") lb.classList.remove("on"); if (e.key === "ArrowLeft") show(cur - 1); if (e.key === "ArrowRight") show(cur + 1); });

/* Ucapan: simpan di browser + BARU: kirim lewat WhatsApp */
const KEY = "ucapan-" + C.id, f = $("#f");
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
const render = () => {
  const d = load();
  $("#list").innerHTML = d.length ? d.map(x => `<article><h4>${esc(x.nama)}</h4><small>${esc(x.hadir)}, ${esc(x.jumlah)} orang</small><p>${esc(x.pesan)}</p></article>`).join("") : '<p class="empty">Belum ada ucapan. Jadilah yang pertama mengirim doa untuk kedua mempelai.</p>';
};
f.onsubmit = e => {
  e.preventDefault();
  const d = load(); d.unshift(Object.fromEntries(new FormData(f)));
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (x) { return toast("Ucapan tidak bisa disimpan di browser ini"); }
  f.reset(); render(); toast("Ucapan terkirim. Terima kasih!");
};
$("#wa").onclick = () => {
  if (!f.reportValidity()) return;
  const v = Object.fromEntries(new FormData(f));
  const m = `Halo, saya ${v.nama}. Saya ${v.hadir.toLowerCase()} di pernikahan ${A} & ${B} (${v.jumlah} orang).\n\n${v.pesan}`;
  window.open(`https://wa.me/${C.wa}?text=${encodeURIComponent(m)}`, "_blank", "noopener");
};
render();

/* Progres scroll: bar atas + garis rute cerita */
const bar = $("#bar"), rt = $("#rt");
const onScroll = () => {
  bar.style.transform = `scaleX(${scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight)})`;
  const r = rt.getBoundingClientRect();
  rt.style.setProperty("--p", Math.min(1, Math.max(0, (innerHeight * .65 - r.top) / r.height)));
};
addEventListener("scroll", onScroll, { passive: true }); onScroll();

/* Muncul saat di-scroll */
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .12 });
document.querySelectorAll(".rv").forEach(el => io.observe(el));
</script>
</body>
</html>
